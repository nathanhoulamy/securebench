schema_version: "1.0"

run:
  id: deep-swe-v2-pilot-linux
  output_dir: ../../runs/deep-swe-v2-pilot-linux
  max_workers: 1

benchmark:
  manifest: manifest-v2.yaml
  tasks: tasks-v2.jsonl

docker:
  max_cached_images: 1

harness:
  type: codex
  config:
    auth: api_key
    model: gpt-5.6-luna
    reasoning_effort: none
    version: latest
    task_file: task.json
    timeout_seconds: 5400
    allowed_domains: []
    allow_external_tools: false
