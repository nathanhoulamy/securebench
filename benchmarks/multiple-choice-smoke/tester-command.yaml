schema_version: "0.2"

run:
  id: multiple-choice-smoke-command
  output_dir: ../../runs/multiple-choice-smoke-command

benchmark:
  manifest: manifest.yaml
  tasks: tasks.jsonl

harness:
  type: command
  mode: host
  config:
    task_file: task.json
    command:
      - python3
      - -c
      - |
        import json

        task = json.load(open("task.json"))
        answers = {
            "What is 2 + 2?": "C",
            "Which protocol commonly secures HTTP traffic?": "TLS",
            "Which digest length matches SHA-256 output in bytes?": "Final answer is 32.",
        }
        print(answers[task["question"]])
    timeout_seconds: 10
