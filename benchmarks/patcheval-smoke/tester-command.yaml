schema_version: "0.2"
run:
  id: patcheval-smoke-command
  output_dir: ../../runs/patcheval-smoke-command
benchmark:
  manifest: manifest.yaml
  tasks: tasks.jsonl
harness:
  type: command
  config:
    command:
      - python3
      - ./.securebench/produce_candidate.py
      - task.json
      - candidate.patch
    artifact_path: candidate.patch
    timeout_seconds: 30
