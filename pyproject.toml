[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "securebench"
version = "0.1.0"
description = "Benchmark evaluation framework with separated trusted and untrusted execution."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
hf = ["datasets>=2.19"]

[project.scripts]
securebench = "securebench.cli:main"

[tool.setuptools.packages.find]
include = ["securebench*", "securebench_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
