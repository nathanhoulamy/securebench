      include_roots:
        - /app
        - /etc/nginx
      max_files: 20000
      max_total_bytes: 1073741824
      reject_devices: true
      reject_sockets: true
  resources:
    vnc_http_adapter:
      visibility: evaluation_inputs
      path: install-windows-3.11/adapter
      kind: directory
      mount: /opt/securebench/adapters/vnc-http
      read_only: true
    challenge_cases:
      visibility: hidden
      path: install-windows-3.11/oracle/cases
      kind: directory
    pristine_disk:
      visibility: hidden
      path: install-windows-3.11/oracle/win311.img.digest
      kind: file
    task_oracle:
      visibility: hidden
      path: install-windows-3.11/oracle
      kind: directory
  checks:
    - id: disk_and_core_files
      patterns: [passive_artifact]
      driver:
        type: artifact
        paths:
          - /app/isos/win311.img
      observe:
        files: 1
        total_bytes: 536870912
    - id: desktop_keyboard_and_reachability
      patterns: [black_box]
