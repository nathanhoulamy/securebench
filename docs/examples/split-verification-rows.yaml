# ---------------------------------------------------------------------------
# TerminalBench: network-service black-box verification. The overlay is needed
# because the task modifies system configuration outside /app.
# ---------------------------------------------------------------------------
id: terminal-bench/configure-git-webserver
family: terminal_task
input:
  instructions: "<unchanged TerminalBench configure-git-webserver instruction>"
environment:
  image: "securebench-terminal-bench-configure-git-webserver@sha256:<digest>"
  workdir: /app
  timeout_seconds: 900
eval:
  candidate:
    capture:
      type: filesystem_overlay
      include_roots:
        - /app
        - /etc/nginx
        - /etc/ssh
        - /git
        - /var/www
      max_files: 20000
      max_total_bytes: 536870912
      reject_devices: true
      reject_sockets: true
  resources:
    git_http_adapter:
      visibility: evaluation_inputs
      path: configure-git-webserver/adapter
      kind: directory
      mount: /opt/securebench/adapters/git-http
      read_only: true
    challenge_cases:
      visibility: hidden
      path: configure-git-webserver/oracle/cases
      kind: directory
    task_oracle:
      visibility: hidden
      path: configure-git-webserver/oracle
      kind: directory
  checks:
    - id: push_deploy_fetch
      patterns: [black_box]
      driver:
        type: network_service
        adapter: git_http_adapter
        protocol: securebench.git-push-http-fetch/v1
        endpoints:
          - id: git
            protocol: ssh
            guest_port: 22
          - id: web
            protocol: http
            guest_port: 8080
      challenge:
        source: challenge_cases
        delivery: one_at_a_time
        max_cases: 8
      observe:
        protocol: securebench.protocol-transcript/v1
        limits:
          requests_per_case: 32
          body_bytes: 1048576
          stderr_bytes: 16384
          seconds_per_case: 30
      isolation:
        scope: scenario
        network: evaluation_private
        evaluation_vm_cannot_initiate_host_connections: true
  oracle: task_oracle
metadata:
  source_dataset: terminal-bench-2
  source_revision: 2fd12b88aafdd04a52c298e3940bcb189f9766d6
