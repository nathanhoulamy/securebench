# ---------------------------------------------------------------------------
id: terminal-bench/constraints-scheduling
family: terminal_task
input:
  instructions: "<unchanged TerminalBench constraints-scheduling instruction>"
assets:
  - path: constraints-scheduling/alice_calendar.ics
    mount: /app/alice_calendar.ics
    read_only: true
  - path: constraints-scheduling/bob_calendar.ics
    mount: /app/bob_calendar.ics
    read_only: true
  - path: constraints-scheduling/carol_calendar.ics
    mount: /app/carol_calendar.ics
    read_only: true
environment:
  image: "securebench-terminal-bench-constraints-scheduling@sha256:<digest>"
  workdir: /app
  timeout_seconds: 1200
eval:
  candidate:
    capture:
      type: file_bundle
      files:
        - id: schedule
          path: /app/meeting_scheduled.ics
          kind: regular_file
          max_bytes: 65536
      reject_symlinks: true
      reject_special_files: true
  resources:
    pristine_calendars:
      visibility: hidden
      path: constraints-scheduling/oracle/calendars
      kind: directory
    task_oracle:
      visibility: hidden
      path: constraints-scheduling/oracle
      kind: directory
  checks:
    - id: schedule_artifact
      patterns: [passive_artifact]
      driver:
        type: artifact
        artifacts: [schedule]
      observe:
        files: 1
        total_bytes: 65536
  oracle: task_oracle
