# Run `python -m securebench.cli auth codex login` before using this config.
schema_version: "1.0"

run:
  id: terminal-bench-v2-codex-subscription
  output_dir: ../../runs/terminal-bench-v2-codex-subscription

benchmark:
  manifest: ../../benchmarks/terminal-bench/manifest-v2.yaml
  tasks: ../../benchmarks/terminal-bench/tasks-v2.jsonl

harness:
  type: codex
  config:
    auth: subscription
    model: gpt-5.4-mini
    reasoning_effort: high
    version: latest
    task_file: task.json
    timeout_seconds: 1200
    allow_external_tools: false
