# Run `python -m securebench.cli auth codex login` before using this config.
schema_version: "0.2"

run:
  id: deep-swe-codex-subscription
  output_dir: ../../runs/deep-swe-codex-subscription

benchmark:
  manifest: ../../benchmarks/deep-swe/manifest.yaml
  tasks: ../../benchmarks/deep-swe/tasks.jsonl

harness:
  type: codex
  config:
    auth: subscription
    model: gpt-5.4-mini
    reasoning_effort: high
    version: latest
    task_file: task.json
    timeout_seconds: 5400
    allow_external_tools: false
