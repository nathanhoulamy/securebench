# Generate CLAUDE_CODE_OAUTH_TOKEN with `claude setup-token` before using this config.
schema_version: "1.0"

run:
  id: terminal-bench-v2-claude-code-subscription
  output_dir: ../../runs/terminal-bench-v2-claude-code-subscription

benchmark:
  manifest: ../../benchmarks/terminal-bench/manifest-v2.yaml
  tasks: ../../benchmarks/terminal-bench/tasks-v2.jsonl

harness:
  type: claude_code
  config:
    auth: subscription
    model: sonnet
    version: latest
    task_file: task.json
    timeout_seconds: 1200
    allow_external_tools: false
