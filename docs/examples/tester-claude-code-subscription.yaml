# Generate CLAUDE_CODE_OAUTH_TOKEN with `claude setup-token` before using this config.
schema_version: "0.2"

run:
  id: deep-swe-claude-code-subscription
  output_dir: ../../runs/deep-swe-claude-code-subscription

benchmark:
  manifest: ../../benchmarks/deep-swe/manifest.yaml
  tasks: ../../benchmarks/deep-swe/tasks.jsonl

harness:
  type: claude_code
  config:
    auth: subscription
    model: sonnet
    version: latest
    task_file: task.json
    timeout_seconds: 5400
    allow_external_tools: false
