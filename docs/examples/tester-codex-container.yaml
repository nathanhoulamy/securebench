# Set OPENAI_API_KEY in .env before using this API-key example.
schema_version: "1.0"

run:
  id: terminal-bench-v2-codex-api-key
  output_dir: ../../runs/terminal-bench-v2-codex-api-key

benchmark:
  manifest: ../../benchmarks/terminal-bench/manifest-v2.yaml
  tasks: ../../benchmarks/terminal-bench/tasks-v2.jsonl

harness:
  type: codex
  config:
    auth: api_key
    model: gpt-5.4-mini
    reasoning_effort: high
    version: latest
    task_file: task.json
    timeout_seconds: 1200
    allow_external_tools: false
