# Set OPENAI_API_KEY in .env before using this API-key example.
schema_version: "0.2"

run:
  id: deep-swe-codex-api-key
  output_dir: ../../runs/deep-swe-codex-api-key

benchmark:
  manifest: ../../benchmarks/deep-swe/manifest.yaml
  tasks: ../../benchmarks/deep-swe/tasks.jsonl

harness:
  type: codex
  config:
    auth: api_key
    model: gpt-5.4-mini
    reasoning_effort: high
    version: latest
    task_file: task.json
    timeout_seconds: 5400
    allow_external_tools: false
